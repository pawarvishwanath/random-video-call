<!DOCTYPE html>
<html>
<head>
  <title>Random Video Call</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    video { width: 45%; margin: 10px; border: 2px solid #333; }
    #videos { display: flex; justify-content: center; }
    #status { margin: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Random Video Call</h2>
  <div id="videos">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <button id="startBtn">Start Call</button>
  <div id="status">Idle</div>

  <script>
    let localStream, peerConnection, ws;
    const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    async function startCall() {
      document.getElementById("status").textContent = "Connecting to server...";
      ws = new WebSocket("wss://random-video-call-kipn.onrender.com"); // ✅ Replace with your Render URL

      ws.onopen = () => {
        document.getElementById("status").textContent = "Connected. Waiting for partner...";
      };

      ws.onmessage = async event => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (e) {
          console.error("Not JSON:", event.data);
          return;
        }

        if (data.type === "match") {
          document.getElementById("status").textContent = "Partner found! Starting call...";
          peerConnection = new RTCPeerConnection(servers);

          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          document.getElementById("localVideo").srcObject = localStream;
          localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

          peerConnection.ontrack = e => {
            document.getElementById("remoteVideo").srcObject = e.streams[0];
          };

          peerConnection.onicecandidate = e => {
            if (e.candidate && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
            }
          };

          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "offer", offer }));
          }
        }

        if (data.type === "offer") {
          document.getElementById("status").textContent = "Received offer. Answering...";
          peerConnection = new RTCPeerConnection(servers);

          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          document.getElementById("localVideo").srcObject = localStream;
          localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

          peerConnection.ontrack = e => {
            document.getElementById("remoteVideo").srcObject = e.streams[0];
          };

          peerConnection.onicecandidate = e => {
            if (e.candidate && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
            }
          };

          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: data.offer }));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "answer", answer }));
          }
        }

        if (data.type === "answer") {
          document.getElementById("status").textContent = "Connected!";
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: data.answer }));
        }

        if (data.type === "candidate") {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }

        if (data.type === "disconnect") {
          document.getElementById("status").textContent = "Partner disconnected.";
        }
      };
    }

    document.getElementById("startBtn").onclick = startCall;
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Random Video Call</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    video { width: 45%; margin: 10px; border: 2px solid #333; }
    #videos { display: flex; justify-content: center; }
  </style>
</head>
<body>
  <h2>Random Video Call</h2>
  <div id="videos">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <button id="startBtn">Start Call</button>

  <script>
    let localStream, peerConnection, ws;
    const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    async function _startCall() {
      ws = new WebSocket("https://random-video-call-kipn.onrender.com"); // Replace with your Render URL

      ws.onmessage = async event => {
        const data = JSON.parse(event.data);

        if (data.type === "match") {
          peerConnection = new RTCPeerConnection(servers);

          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          document.getElementById("localVideo").srcObject = localStream;
          localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

          peerConnection.ontrack = e => {
            document.getElementById("remoteVideo").srcObject = e.streams[0];
          };

          peerConnection.onicecandidate = e => {
            if (e.candidate) {
              ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
            }
          };

          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          ws.send(JSON.stringify({ type: "offer", offer }));
        }

        if (data.type === "offer") {
          peerConnection = new RTCPeerConnection(servers);

          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          document.getElementById("localVideo").srcObject = localStream;
          localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

          peerConnection.ontrack = e => {
            document.getElementById("remoteVideo").srcObject = e.streams[0];
          };

          peerConnection.onicecandidate = e => {
            if (e.candidate) {
              ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
            }
          };

          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: data.offer }));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          ws.send(JSON.stringify({ type: "answer", answer }));
        }

        if (data.type === "answer") {
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: data.answer }));
        }

        if (data.type === "candidate") {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      };
    }

    document.getElementById("startBtn").onclick = _startCall;
  </script>
</body>
</html>

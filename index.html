<script>
  let localStream, peerConnection, ws;
  const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

  async function startCall() {
    ws = new WebSocket("https://random-video-call-kipn.onrender.com"); // Replace with your server URL

    ws.onmessage = async event => {
      const data = JSON.parse(event.data);

      if (data.type === "match") {
        peerConnection = new RTCPeerConnection(servers);

        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById("localVideo").srcObject = localStream;
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = e => {
          document.getElementById("remoteVideo").srcObject = e.streams[0];
        };

        peerConnection.onicecandidate = e => {
          if (e.candidate) {
            ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: "offer", offer }));
      }

      if (data.type === "offer") {
        peerConnection = new RTCPeerConnection(servers);

        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById("localVideo").srcObject = localStream;
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = e => {
          document.getElementById("remoteVideo").srcObject = e.streams[0];
        };

        peerConnection.onicecandidate = e => {
          if (e.candidate) {
            ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
          }
        };

        await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: data.offer }));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: "answer", answer }));
      }

      if (data.type === "answer") {
        await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: data.answer }));
      }

      if (data.type === "candidate") {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    };
  }

  document.getElementById("startBtn").onclick = startCall;
</script>
